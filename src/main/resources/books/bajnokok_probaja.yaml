            Az ujjongó nézősereg éljenzése közepette áthaladsz a két pillér között, kezedben egyetlen fegyvereddel, a Lord Carnuss által neked adomá nyozott nagyszerű karddal. Nincs sem hátizsákod, sem élelmed, sem páncélruhád, így aztán eléggé felkészületlennek érzed magad a rád váró meg próbáltatásokkal szemben, de legalább veled van ez a remek kard meg egy bőrerszény, melyet az övedhez erősítettél. A tömeg éljenzése lassan elhal mögötted, amint egyre beljebb jutsz a gyéren megvilágított alagútban. Nehéz elképzelned, hogy milyen szörnyűségek várnak rád, de azt tudod, hogy Sukumvit báró az elmúlt évet azzal töltötte, hogy átépítse Halállabirintusát, amelyről az a hír járja, hogy minden képzeletet felülmúlóan veszedelmes. Mégis a győzelem reményével tölt el a vágy, hogy megbosszuld rabszolgatársaid halálát.
            Jó negyven méteren át egyenesen haladsz az alagútban, majd egy ajtóhoz érsz, amely bal kéz felől nyílik a falban. Vérrel írták rá a következőket: "Belépni tilos." Az ajtó mögül kaparászást, fújtatást hallasz.
