    - index: 13
      actions:
        - display: |
            Benyitsz az ajtón, és egy kis szobában találod magad, ahol évek óta nem járt senki. Vastag por takar mindent, a pókhálók függönyként lógnak alá. A szemközti falnak támaszkodva két tátott szájú csontváz ül derékig a porba ágyazva. Az egyik csontváz ujjával rámutat a másikra. Hirtelen becsapódik mögötted az ajtó, és az ujjal mutogató csontváz megszólal. - Nincsen sem bátyám, sem nővérem, de ennek az embernek az apja az én apámnak a fia. Ki ő? - Mit teszel?
        - goto:
            - chapter: 207
              text: Az ajtóhoz rohansz?
            - chapter: 84
              text: Azt válaszolod, hogy ő a nagyapja?
            - chapter: 302
              text: Azt válaszolod, hogy ő az apja?
            - chapter: 371
              text: Azt válaszolod, hogy ő a fia?
    - index: 14
      actions:
        - display: |
            Gyorsan felragadod a rövid dárdát, és visszamászol a lyukon, mielőtt még bárki megjelenne a csapatból, hogy megnézze, mi történt.
        - goto:
            - chapter: 155
              text: Tovább...
    - index: 15
      actions:
        - display: |
            Nagy bátorsággal és elszántsággal legyőzöd a fájdalomérzetet. Kimerülten zuhansz a földre, amikor fájdalmad végre csökken. Teljesen legyengültél, minden erőd elhagyott. Vesztesz 3 ÉLETERŐ pontot. Felülsz, és elhajítod az elátkozott kesztyűt. Liche Királynő némán lehúz az ujjáról egy aranygyűrűt, és a lábad elé veti. Nem kérdezel tőle semmit, csak felkapod a gyűrűt, és kirohansz a szobából az alagútba.
        - modify:
            values:
                - field: STAMINA
                  value: -3
        - addItem:
            items:
            - name: Aranygyűrű
              multiple: true
        - goto:
            - chapter: 285
              text: Jobbra fordulsz?
            - chapter: 227
              text: Balra mész a T elágazás mellett?
    - index: 16
      actions:
        - display: |
            A lángok nagy meleget árasztanak, de a tűzbiztos palást védelmet nyújt. Amikor átmész a boltív alatt, egy keresztútnál találod magad. Jobbra nézve nem látsz semmi érdekeset a hosszú alagútban, de amikor balra tekintesz, észreveszed, hogy lóg valami a mennyezetről. Úgy döntesz, hogy megnézed, mi az.
        - goto:
            - chapter: 88
              text: Tovább...
    - index: 17
      actions:
        - display: |
            A csel sikerül. Láncos buzogányod nekivágódik ellenfeled lábának, aki elesik. Míg ott nyög a földön, úgy döntesz, hogy továbbállsz, még mielőtt valaki más is meghallja, hol vagy. Amilyen csöndben csak lehet, balra indulsz.
        - goto:
            - chapter: 120
              text: Tovább...
    - index: 18
      actions:
        - display: |
            Csakhamar megtudod, miért voltak ott a patkányok a szobában, ahol most vagy. Ez ugyanis egy raktár, amely zsúfolva van hordókkal, zsákokkal és ládákkal. A falak mentén, a földtől a mennyezetig, kancsókkal és palackokkal teli polcok húzódnak. Ennek ellenére az élelmiszer nagyobb része penészes és rohadt, és azt is megdézsmálták a patkányok. Miután csaknem mindent kinyitsz és átvizsgálsz, csak egy cipót meg egy darab sós húst találsz többé-kevésbé ehetőnek. Mit teszel?
        - goto:
            - chapter: 57
              text: Megeszed a cipót?
            - chapter: 184
              text: Megeszed a sós húst?
            - chapter: 305
              text: Nem eszel semmit, és ismét fölmész a lépcsőn?
    - index: 19
      actions:
        - display: |
            A Lopakodónak semmije sincs, kivéve egy csontmedált, amely a nyakában lóg.
        - goto:
            - chapter: 70
              text: A medált a saját nyakadba akarod tenni?
            - chapter: 328
              text: Inkább visszamászol a kötélen?
    - index: 20
      actions:
        - display: |
            Elöl az alagútban hirtelen mozgásra leszel figyelmes. Egy kicsiny, emberszerű lény, amint megpillant, elfut előled. Kíváncsi vagy, vajon ki lehet az, így hát utánaeredsz.
        - goto:
            - chapter: 258
              text: Tovább...
    - index: 21
      actions:
        - display: |
            Az alagút elég meredeken emelkedik felfelé, és a levegő egyre hűvösebb lesz. A sima utat kőlépcsők váltják fel, s ez kissé megkönnyíti számodra a haladást. Félúton vagy, amikor három egymást követő, pirosra festett lépcsőfokot veszel észre.
        - goto:
            - chapter: 372
              text: Továbbmész a lépcsőkön?
            - chapter: 50
              text: Inkább átléped a három piros lépcsőfokot?
    - index: 22
      actions:
        - display: |
            Negyvenkét rabszolga társaságában haladsz át különböző tekergős folyosókon, mígnem az arénába jutsz. A nap teljes erővel tűz, és elviselhetetlenül forróvá hevíti mezítelen lábatok alatt a homokot. Egy tribün tetején fekete páncélba öltözött, sisakos alakot pillantasz meg, akit kétoldalt egy-egy őr vigyáz. Leborultok előtte, és figyelitek, amint Lord Carnuss kezét a magasba emelve így szól hozzátok:
            - Ugye tudjátok, miért vagytok itt! Az az óhajom, hogy képviseltessem magam a Bajnokok próbáján. Néhányan közületek már ma meghalnak, néhányan holnap vagy az azt követő napokon, mindaddig, amíg csak egyvalaki marad életben. Halálba menők, köszöntelek benneteket! - Lord Carnuss ezután ismét helyet foglal, és fejének egyetlen biccentésével jelt ad a kezdéshez. A rabszolgákat hatos csoportokban hétfelé osztják. Te egy elffel, két északi emberrel, egy törpével meg egy ogre-val kerülsz egy csoportba. A te csoportod kezd, mégpedig elsőként a kitartás- és erőpróbával. Mindegyikőtök hátára nehéz kövekkel megrakott zsákot kötöznek. Ekkor izzó parazsat hoznak be, és kupacokba rakják a küzdőtéren. Mind a hatan a startvonalhoz álltok, és az adott jelre a zsákkal a hátatokon addig kell az izzó parázskupacok között versenyt futnotok, amíg egyikőtök meg nem botlik vagy össze nem esik. Elindultok, és sorban egymás után megpróbáljátok átugrani az első halom parazsat.
        - goto:
            - chapter: 310
              text: Gyorsítani akarod a lépteidet?
            - chapter: 107
              text: Inkább hátul maradsz?
    - index: 23
      actions:
        - display: |
            Az alagúton még körülbelül száz métert haladsz előre, amikor valami furcsát észlelsz. Balról a falban egy boltívet pillantasz meg, melyet vas sárkányfejek díszítenek. A sárkányok száján lángnyelvek csapnak ki, összefüggő tűzfüggönyt alkotva a boltív előtt. Kissé távolabb az alagútban észreveszed, hogy valami lóg a mennyezetről.
        - goto:
            - chapter: 101
              text: Átfutsz a tüzes nyíláson?
            - chapter: 88
              text: Inkább megnézed, mi lóg a mennyezetről?
    - index: 24
      actions:
        - death: |
            Egyik versenyző sem követ a boszorkány szobájába. Amikor a boszorkány ismét testet ölt, fülsiketítő kacagásban tör ki, amint meglátja az arcodat a doboz fedelén. Még legalább egy évig nem lesz látogatója ennek a szobának, ahol mindörökre fogságban maradsz.
    - index: 25
      actions:
        - display: |
            A Próbamester egy pillanatra elhallgat, majd lassan közli:
            - Túljutottál a második próbán. Most az utolsó felvonás következik - velem kell megküzdened! Bambuszrudakkal fogunk harcolni - mintha karddal vívnánk meg. Minden egyes fejre vagy mellkasra mért ütés halálosnak számít. Tájékoztatásodra még elmondom, hogy vakságom nem jelent számomra semmiféle hátrányt, ugyanis a fülem igen jó, és mindig tudni fogom, merre vagy. Most pedig vedd ki a rudat a szekrényből, én készen állok.
            Amikor elveszed a rudat, a Próbamester feláll, és a fadobozok lehullanak a földre. Mezítláb közelít feléd, fejét oldalra fordítva, hogy jobban halljon.
        - goto:
