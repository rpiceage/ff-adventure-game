            Gazdagon bútorozott szobába nyitsz be. Fantasztikus tárgyak vesznek körül, de a szemed mégis egy magas emelvényen álló kincsesládán akad meg, mely a terem végében van. Színarany sasszobrok szegélyezik az emelvényre felvezető márványlépcső négy sarkát. A kincsesláda dugig van gyémánttal, arannyal és drágakővel. Fölmész a lépcsőkön, de abban a pillanatban, amikor a kincsek után nyúlnál, az aranytárgyak meg a drágakövek eltűnnek, és helyettük a félelmetes Agytorzító Szörny kitátott száját pillantod meg. Ez akegyetlen gyilkos tökéletes illúzióteremtő képességgel rendelkezik, és most egy tűhegyes fogakkal szegélyezett hatalmas zöld száj alakjában jelent meg. Az állkapocs összecsattan; kis híján kettéharap. A következő harapás azonban már sikeresebb...
    - index: 387
      actions:
        - death: |
            Ellenfeled tüskés buzogánya célba talál - a fejedet éri. Eszméletlenül zuhansz a földre, és többé nem mozdulsz. Megpróbáltatásaid az arénában ezzel véget érnek.
    - index: 388
      actions:
        - display: |
            Amint mész, meglepődsz, amikor a fejed fölött cincogó hangon valaki így kiált:
            - Helló! - Felnézel, és látod, hogy a mennyezetben lévő rács mögül egy parányi arc tekint le rád. - Éhes vagyok! - mondja a kis ember. - Adj valamit ennem, és cserébe mondok egy-két dolgot arról, akivel találkoznod kell.
            Ezzel kötélen leereszt egy gyapjúzsákot, abban a reményben, hogy kap valamit. Ha akarsz egy kevés diót és bogyót adni a kis embernek, aktiváld a Kalandlapodon!
        - useItem:
            - item: Dió és bogyók
              chapter: 309
              loseAfterUse: true
        - goto:
            - chapter: 58
              text: Inkább továbbmész, anélkül hogy adnál neki értékes ételedből?
    - index: 389
      actions:
        - interrupt: |
            Szerencséd, hogy nem volt veszett a patkány, amely megharapott. Elrántod a lábadtól az aljas rágcsálót, és beledöfsz a kardoddal. Folytasd a harcot!
    - index: 390
      actions:
        - display: |
            Nekisimulsz az alagút falának, és szép lassan, óvatosan átlépsz a lándzsák alatt. Amikor végre túljutsz rajtuk, arra gondolsz, biztosan azért tették ide őket, hogy visszariadjon, aki erre jön. Felnyúlsz, és éppen csak eléred a lándzsa hegyét.
        - goto:
            - chapter: 110
              text: Megpróbálod kihúzni a lándzsát a helyéből?
            - chapter: 5
              text: Inkább továbbmész?
    - index: 391
      actions:
        - display: |
            Belesel a Százlábú sötét barlangjába. A falak nyirkosak, nyálkásak, és nem látsz messzire.
        - goto:
            - chapter: 89
              text: Be akarsz menni a barlangba?
            - chapter: 161
              text: Inkább továbbmész az alagútban?
    - index: 392
      actions:
        - death: |
            A Próbamester nem várja meg, hogy megszámold a gyűrűket. Barátságtalan hangon így szól:
            - Egyféleképpen lehet elbánni a hazugokkal.
            Mielőtt még kardot ránthatnál, villám csap ki a varázsló előremutató ujjából, és a melledbe fúródik. Oly közel jártál már a sikerhez, s mégis oly távol kerültél tőle... megbuktál a végső próbán.
    - index: 393
      actions:
        - display: |
            Szerencsére a pajzsot tartó kezed sérült meg. Vesztesz 2 ÉLETERŐ pontot!
        - modify:
            values:
                - field: STAMINA
                  value: -2
        - goto:
            - chapter: 159
              text: Nem mozdulsz arról a helyről, ahol állsz, és meglengeted láncos buzogányodat?
            - chapter: 120
              text: Balra lépsz?
    - index: 394
      actions:
        - display: |
            A fáklya lángja félelmetes árnyakkal tölti meg az elhagyott alagutat, de téged csak az ajtó túloldalán lévő szavak és számok érdekelnek. Alig olvasható írással a következőt látod: "Első sorozat, 249." Jól bevésed az agyadba, amit olvastál, majd kimész az ajtón, és elindulsz a T elágazás másik végében lévő ajtó felé.
        - goto:
            - chapter: 375
              text: Tovább...
    - index: 395
      actions:
        - display: |
            A gyümölcs kitűnő, nagyon ízlik. Nyersz 2 ÉLETERŐ pontot! Amikor már eleget ettél, visszatérsz az alagútba, és továbbmész rajta felfelé.
        - modify:
            values:
                - field: STAMINA
                  value: 2
        - goto:
            - chapter: 20
              text: Tovább...
    - index: 396
      actions:
        - death: |
            Mint a ketrecbe zárt oroszlán, megpróbálsz kibújni a rácsok között, s egyre dühösebb leszel. Csapdába kerültél, és nincs menekvés.
    - index: 397
      actions:
        - display: |
            Az alagút nemsokára egy kő lépcsősornál ér véget. A korlátra erősített nyitott koponyákban gyertyák égnek, s megvilágítják az utat. A lépcsőn fölfelé is, lefelé is mehetsz.
        - goto:
            - chapter: 305
              text: Fölfelé indulsz?
            - chapter: 93
              text: Inkább lefelé?
    - index: 398
      actions:
        - display: |
            A bal oldali falban, egy boltíves beugróban kutyafejű, embertestű istenség bronzszobrát látod. A bálvány fölfelé fordítja a tenyerét, s alatta a következő felirat olvasható: "Ha egy aranytárgyat adsz, továbbmehetsz, hacsak nem akarsz meghalni." Ha van nálad aranytárgy, és bele akarod tenni a bálvány tenyerébe, aktiváld a Kalandlapodon!
        - useItem:
          - item: Aranygyűrű
            chapter: 299
        - goto:
            - chapter: 193
              text: Inkább megpróbálsz elmenni mellette?
    - index: 399
      actions:
        - display: |
            Szerencsédre megszűnik a lidércnyomás, amikor egy másik versenyző lép be a boszorkány szobájába, és kinyitja a faládát. Vakító fény villan, és úgy érzed, mintha tested megnyúlna. Egy üres kis szobában találod magad. Az egyik falban fogantyú van, amit le lehet húzni vagy fel lehet tolni.
        - goto:
            - chapter: 242
              text: Feltolod a fogantyút?
            - chapter: 376
              text: Lehúzod a fogantyút?
    - index: 400
      actions:
        - win: |
            A tömeg vad éljenzése közepette átveszed a győztesnek járó jutalmat Sukumvit bárótól. Álmodni sem mertél volna ekkora pénzösszegről, amit most egyedül vihetsz el. A következő héten kipihened a megpróbáltatások fáradalmait, és ismét kezded jól érezni magad. Azon gondolkodol, vajon mire is költsd ezt a nagy halom pénzt. Ekkor vad ötleted támad. Mi lenne, ha felfogadnál egy hadsereget, és meghódítanád a Holdkő Domboktól északra fekvő ismeretlen tájakat? Minél többet gondolsz erre, annál jobban vonz az ötlet. Másnap megteszed az előkészületeket, és toborzólistákat küldesz szét a városban és a környező tartományokban. Egy hét múlva lelkesen indulsz el északnak zsoldos katonáiddal, hogy új kalandokat keress.
