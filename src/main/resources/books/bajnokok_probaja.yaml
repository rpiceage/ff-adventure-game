chapters:
    - index: 0
      actions:
        - display: |
            Háttértörténet

            Ma is iszonyatosan meleg van, a hajófenéken a sűrű félhomályban a hőség szinte kibírhatatlan. Fanyar izzadságszag terjeng a levegőben. Tilos beszélgetni, és a hajótest monoton nyikorgásán kívül csupán az ostor ütemes csattanásait lehet hallani, meg az azt követő kétségbeesett jajgatást.
            - Húzzátok meg, kutyák! - kiáltja torkaszakadtából a félszemu felügyelő, miközben ismét suhint egyet az ostorral. - Addig élvezzétek ezt a kellemes kis kirándulást, ameddig lehet, mert ha egy-két napot eltöltötök ott, ahova megyünk, garantálom, hogy visszasírjátok majd ezt a helyet!
            Egy padhoz láncolva, nekifeszülve a hosszú evezőlapátnak, melyet másik két gályarabtársaddal húzol, arra a szerencsétlen napra gondolsz, amikor egy hete elfogtak.
            Feketehomok kikötőt egy kis bárkán hagytad el, és délnek vetted az irányt, az Osztriga-öböl felé. A balszerencse úgy hozta, hogy egy gálya bukkant fel a láthatáron, és egyenesen feléd tartott. Egyre közelebb került hozzád, majd orrával hamarosan szétzúzta a bárkádat. Nem volt más választásod, a tengerbe kellett vetned magad, majd, mivel hajódból néhány, a vízen úszkáló lécen kívül semmi sem maradt, felmásztál a neked ledobott kötélen. A hajó fedélzetére feljutva felesleges lett volna bármiféle ellenállás, mert azonnal húsz keménykötésű kalóz vett körül. Mogorva hang dörrent a kalózok mögött, erre azok utat engedtek egy ronda, sebhelyes arcú férfinak, aki dohánylevelet rágcsált, s a levét a fedélzet deszkáira köpködte. Fogai csorbák voltak és feketék, és undorító szag áradt koszos ruhájából.
            - Barella kapitány mindig leszállítja az árut! - mondta. - Majd beállsz annak a helyére, aki tegnap belehalt a korbácsolásba. Legalább így nem kényszerülök rá, hogy egy szárazföldi patkányt ejtsek foglyul! Számomra szerencsés nap ez a mai, bár rólad nem mondanám el ugyanezt!
            A kapitány nevetésben tört ki, mely úgy hangzott, mint egy ló fújtatása, majd odavakkantotta a kormányosnak: - Vidd le ezt a patkányt a többi féreg közé!
            Ettől az átkozott naptól kezdve az evezőlapáthoz vagy kötve, és a fáradtságtól szinte félholtan evezel az ismeretlen cél felé. Hirtelen kiáltás üti meg a füledet: - Föööld! - és arra gondolsz, vajon mi vár rád. Egy óra múlva a hajó nekiütődik a mólónak, majd nagy hangzavar közepette végre lehorgonyoz. Fogolytársaiddal együtt felvonszolod magad a fedélzetre, ahol a ragyogó napsütésben egy kis szigetet pillantasz meg. Komor vár emelkedik a sziget végében, mellette egy eléggé romos amfiteátrum. Egy fekete páncélinget viselő férfi egy zacskó aranyat ad át Barella kapitánynak, aki boldogan vágja zsebre a fizetséget, és elhajózik. A fekete páncélinges férfi odalép hozzátok, és így szól:
            - Mostantól kezdve Lord Carnuss rendelkezik veletek! Abban a megtiszteltetésben lehet részetek, hogy életeteket áldozhatjátok érte a Vér-sziget Halálarénájában, ahonnan csak egyvalaki fog élve kikerülni közületek. Az a valaki, legyen az férfi vagy nő, fogja képviselni Lord Carnusst Fangban, a következő Bajnokok próbáján. Sukumvit báró átalakította Halállabirintusát, és ezúttal már 20000 arany tallért ajánlott meg annak, aki sikerrel átjut rajta. A győztes a díjat természetesen Lord Carnussnak kell hogy átadja, cserébe viszont a lord megkegyelmez neki. Sukumvit báró hírnevén tavaly elég nagy csorba esett, amikor valakinek sikerült keresztüljutnia a labirintusán, de most azzal kérkedik, hogy senki sem fogja túlélni újjáalakított útvesztőjét. Lord Carnuss azt szeretné, ha valaki közületek móresre tanítaná Sukumvitot. Tudnotok kell, hogy gyűlöli testvérét, amiért ilyen hírneves. És most kövessetek!
            Felvezet benneteket a dombtetőre a várhoz, ahol bezár a föld alatti cellák egyikébe. A sötét cellát négy társaddal osztod meg: egy izmos törpével, egy fél-Orkkal, egy erős keletivel és egy kopasz, csupa izom emberrel. Hangulatotok igen rossz, szinte alig beszélgettek, mivel mindannyian a közelgő versennyel vagytok elfoglalva. Negyvenkét rabszolga érkezett a hajóval, és közülük csak egy marad majd életben, akinek kétes jutalma az lesz, hogy beléphet a Halállabirintusba...
        - goto:
            - chapter: 1
              text: Tovább...
    - index: 1
      actions:
        - display: |
            Másnap hajnalban döngő léptek közeledő zajára ébredtek. Kulcs csikordul a zárban, és két, fekete páncélinget viselő férfi jelenik meg az ajtóban élelemmel megrakott tálcákkal.
            - Sokat egyetek - szól az egyik -, mert erőre lesz szükségetek ahhoz, hogy túléljétek ezt a napot! Lehet, hogy mind meghaltok!
            Ekkor az egyik őr feléd fordul, és egy szelet kenyérrel meg egy tál levessel kínál.
        - goto:
            - chapter: 49
              text: Elfogadod tőle az ételt?
            - chapter: 292
              text: Az őrt leütve inkább megpróbálsz elmenekülni?
    - index: 2
      actions:
        - display: |
            Átlépsz az Óriás Százlábú testén, és benézel a barlangba. A falak nyálkásak, nyirkosak, de bent sötét van, semmit sem lehet látni.
        - goto:
            - chapter: 89
              text: Bemész a barlangba?
            - chapter: 161
              text: Továbbmész az alagútban?
    - index: 3
      actions:
        - display: |
            A szoba közepén törökülésben egy kövér, kopasz, keleties arcvonású férfit látsz. Meg sem moccan, amint előrenyújtott két kezében egy bambuszbotot tart. Vagy fél tucat színes fakocka röpdös körülötte a levegőben. A férfi szeme szürke, tekintete üres. Ez az ember vak. A szobában mindössze egy deszkából összetákolt ágy, egy szekrény meg középen egy asztal áll.
            - Légy üdvözölve, második versenyző. Már vártalak. A nevem Noy, Próbamester vagyok, és Sukumvit báró szolgálatában állok. Az a feladatom, hogy háromféleképpen próbára tegyelek, mielőtt továbbengednélek. Készen állsz-e?
        - goto:
            - chapter: 369
              text: Engedelmeskedsz a Próbamesternek?
            - chapter: 200
              text: Inkább rátámadsz a kardoddal?
