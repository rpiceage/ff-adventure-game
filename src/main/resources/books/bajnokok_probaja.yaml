    - index: 8
      actions:
        - display: |
            Újra támadsz, s az elf némán összeesik, testéből elszállt az élet. A nyelv eleresztette, és visszahúzódik a hatalmas szájüregbe. Megragadod az elfet és kirántod a szájból, de már nem tudsz rajta segíteni. Éppen azon gondolkodol, vajon mit tegyél, amikor az elf szeme hirtelen kinyílik. A haldokló utolsó leheletévei így szól:
            - Köszönöm, hogy megpróbáltad megmenteni az életemet. Nem kellett volna megtenned, hiszen innen csak egyikünk kerülhet ki élve, s ez a valaki nem én leszek. Vedd magadhoz mindenemet, és menj be a szájba. Ha le tudod győzni azt a rettenetes valamit, ami engem meglepett, azt hiszem, sikerrel fogsz járni.  Szeme lecsukódik, és az elf kileheli a lelkét. A derekához erősített kis zsákban egy tégelyt találsz, melyben igen erős szagú, szürke színű kenőcs van. Minthogy jól ismered az elfeket, rögtön sejted, hogy ez gyógyító erejű kenőcs, úgyhogy rögvest be is kened vele a sebeidet. A kenőcs azonnal hat.
        - goto:
            - chapter: 408
              text: Tovább...
