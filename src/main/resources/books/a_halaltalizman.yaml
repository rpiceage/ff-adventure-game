    - index: 114
      actions:
        - display: |
            A Pap odalép hozzád és a következő történetet meséli el neked:
            - A Talizmánt a Halál Istenének szolgái készítették, réges-régen, a Végzet Rúnáinak városában, hogy ha majd eljön az idő gonosz terveik megvalósítására, megidézhessék Istenüket erre a világra. Ez az idő most jött el! Ha a Halál megjelenik itt, az élet megszűnik! Csak a Halál Szolgái maradnak meg undorító félholt állapotukban. A Halál szürke árnyként fog Orbra telepedni. Minden porrá válik, és a természet rendje felborul. Serakub Bölcsei, akik szent életű emberek, azon igyekeznek, hogy megállítsák a szörnyű pusztítást. Elküldtek egy csapatnyi Keresztest, hogy megszerezzék a Talizmánt, de csak mi négyen maradtunk életben. A Halál Szolgáinak Csontváz Királya a Hasadék mélyén rejtette el a Talizmánt. Mi azonban behatoltunk ide, a gonosz fészkébe, és megszereztük.
            Ekkor egy nyakláncot húz elő a köpenye alól. A láncon egy obszidián korong függ, a közepén rubinkoponyával - a Haláltalizmán! Feléd nyújtja, és így szól:
            - Tessék! Orbra kérlek, fogd ezt a Talizmánt és folytasd a küldetésünket! Megsemmisíteni nem lehet, de ha sikerül elvinned a saját világodba, akkor a Csontváz Király többé nem szerezheti meg!
            A hipnotikus varázs kötelez: minden porcikáddal a küldetésre koncentrálsz. A Talizmánt a nyakadba akasztod. Hideg és nehéz. A Varázsló feléd fordul és így szól: - Most varázshatalmammal kijuttatlak a felszínre. Indulj nyugatnak, míg el nem éred az Ingoványi Szürkecéheket, a tudás városát. Ott majd megtudod, miként juthatsz vissza a saját világodba. Kérlek, ne hagyj cserben minket! Fogd ezt az aranyat, lehet, hogy még hasznát veszed!
