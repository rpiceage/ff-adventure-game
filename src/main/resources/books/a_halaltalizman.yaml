            Páncélingbe öltözött nőt pillantasz meg a fáklyák fényében, kezében felhúzott íjpuska. Amint észrevesz, feléd irányítja a fegyverét. Három libegő férfi tűnik fel mögötte. Az első magas és jó kiállású; csillogó páncélt visel, kétkezes kardjának pengéje halványfehér fényt áraszt. A következőn bő, aranyszínű köpeny és mosolygó aranyálarc van. Kezében elefántcsont botot tart. Az utolsó egy köpcös kis ember, aki páncélinge fölött fehér köpenyt visel, melyet vörös kereszt díszit. Oldalán szöges buzogány lóg. Mindhárman megtorpannak.
            Újra hallani az üvöltést, hangosabban, mint előbb.
            - A sarkunkban vannak! - kiáltja a fénylő kardú harcos.
            A Pajzsos lány megszólal: - Ki vagy te, és mi dolgod itt, a Hasadékban, minden gonoszok bölcsőjében? - Mit válaszolsz?
