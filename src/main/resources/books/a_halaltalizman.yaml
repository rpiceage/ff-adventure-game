      actions:
        - display: |
            Lelked lágyan lebeg a Halál Völgye felé. Alant, ameddig a szem ellát, szélfútta, jellegtelen síkság terül el. A holtak lelkei itt bolyonganak céltalanul, magányosan. Már éppen elérnéd a Völgy szélét, amikor az éteri szél hirtelen felkapja a lelkedet és tovaröppenti. Hamarosan két alak társaságában találod magad, akik megidéztek ebbe a fantasztikus, mágikus világba. A színes ruhás, szem nélküli szólal meg: - Még nincs minden veszve! - Megérted a szavait anélkül, hogy hallanád őket. - Ha a lelked hajlandó rá, újra testet ölthetsz, és mi visszafordít juk az idő kerekét. Ekkor egy másik lény szólal meg: - Ha kívánod, visszaküldelek az időben, és újra ott lehetsz a Hasadék kijáratánál. - Vissza mész az időben és megpróbálod újra teljesíteni a küldetésedet?
