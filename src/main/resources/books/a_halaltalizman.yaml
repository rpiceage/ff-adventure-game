            Búcsúzóul átnyújt neked egy bedugaszolt fiolát. A fiolában a Borostyánfenyő Gyantája van, amellyel összeragaszthatod a pajzsot. Meghívnak vacsorára, ahol mangót, diót és különféle déligyümölcsöt esztek. Nyersz 2 ÉLETERŐ pontot! Aztán köszönetet mondasz és elindulsz. Hosszú mászás után egy kénbűzös barlangnyíláshoz érsz - ez a Sárkány tanyája! Úgy döntesz, bemész.
