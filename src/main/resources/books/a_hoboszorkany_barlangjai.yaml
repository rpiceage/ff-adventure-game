        - death: |
            Nincs, ki megvédjen a Kristályharcos megsemmisítő csapásai ellen. Kalandod itt véget ért.
    - index: 3
      actions:
        - display: |
            Valamilyen csoda folytán egyetlen lezuhanó jégtömb sem talál el. Mikor végre minden megnyugszik körülötted, csodálkozva nézel fel a ragyogó kék égre. Egyikőtök sem fecsérli az idejét, kimásztok a barlangból, és a hegyoldalban találjátok magatokat. Nem havazik, minden nyugodt. Miközben lejöttök a hegyről, elmeséled barátaidnak, hogyan akadtál össze Big Jimmel, és mi késztetett arra, hogy eljöjj a Hóboszorkány barlangjaiba. Úgy véled, Big Jim joggal feltételezheti, hogy meghaltál, és ezért úgy döntesz, nincs már értelme megkeresned, hogy átvedd jutalmadat, amiért a Yetit megölted. Ráállsz hát, hogy elkísérd Redswiftet és Stubbot Kőhidafalvára.
        - goto:
            - chapter: 104
              text: Tovább...
    - index: 4
      actions:
        - display: |
            A bot átszúrja a Hóboszorkány szívét. Halálsikolya iszonyattal tölt el. Zsugorodni kezd, és nemsokára már csak egy kupac por marad belőle. A terem végében, a jégfalon valaminek a halvány körvonala rajzolódik ki. Úgy döntesz, megvizsgálod, mi az.
        - goto:
            - chapter: 235
              text: Tovább...
