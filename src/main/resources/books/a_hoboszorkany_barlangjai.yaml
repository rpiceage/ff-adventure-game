        - display: |
            Stubbot a bosszúvágy hajtja, és gyorsan legyőzi a két Dombi Trollt, majd segít Redswiftnek a másvilágra küldeni a másik kettőt. Nem vesztegeti az időt azzal, hogy átkutassa a Trollok holmiját, hanem azonnal útra kel Kőhidafalvára. Követitek őt a faluba, ahol régi barátai köszöntik. Hamarosan kiderül, hogy a Törpék nagy bajban vannak. Bár tudják, hogy a Dombi Trollok azért gyülekeznek, hogy megtámadják a falujukat, nincs erejük hozzá, hogy megvédjék magukat, mióta híres harci kalapácsukat ellopták Gillibran királytól. Stubb aggódik a kedvüket vesztett Törpékért, és elvisz benneteket egy fogadóba, hogy megismerkedjetek a barátjával, Nagylábbal. Nagylábtól megtudja, hogy egy sas lopta el a kalapácsot, de a Sötét Erdő fölött elejtette. - Meg kell találnunk! Nagyláb, azonnal indulnunk kell! - kiáltja Stubb, feledve saját baját. Feláll, és kezet nyújt nektek. - Sajnálom, barátaim - mondja -‚ de nem tudlak vendégül látni benneteket. Remélem, megértitek! - Aztán kimegy a fogadóból Nagylábbal együtt, és még egy utolsó pillantást vetsz az öreg Törpére. Redswift felsóhajt, és azt tanácsolja, hogy azonnal induljatok útnak a Holdkő-dombok felé. Mellesleg közli, hogy valamit el kell neked mondania, és bizonyos szempontból jó is, hogy Stubb nincs itt, és nem hallja. Szöget üt a fejedbe, vajon mit akarhat mondani Redswift, és ezen töprengsz, miközben továbbhaladtok Kőhidafalváról keletre, a Vörös-folyó mentén. Amíg a Dombi Trollok őrjáratát kémlelitek, ugyanez jár a fejetekben. A fák között megbújva Redswift hirtelen észrevesz három Dombi Trollt, amint a fegyvereiket élesítik egy kövön. Tedd próbára SZERENCSÉD!
