        - display: |
            A Gyógyító mögötted áll és unszol, hogy siess át a barlangon. Csendben végigmész hát rajta, s ekkor egy hasadékon át fényt látsz beszűrődni. Úgy látod, a hasadék éppen akkora, hogy átpréseld magad rajta. Kíváncsian kérded a Gyógyítótól: - És most mi lesz? - Mire ő nyugodtan így felel: - Én innen már nem mehetek tovább. Végső megpróbáltatásoddal egyedül kell szembenézned. Hajnal előtt fel kell érned a Tűz-hegy csúcsára, hogy lásd a napfelkeltét. Ha arcodon a maszkkal, törökülésben kelet felé fordulva leülsz, mikor a felkelő nap első sugarai megjelennek a horizonton - teljesen meggyógyulsz. Ha bármilyen ezüsttárgy van a birtokodban, idehívhatjuk a Pegazust, hogy elröpítsen oda.
            Ha van nálad ezüsttárgy, aktiválhatod a Kalandlapodon.
        - useItem:
