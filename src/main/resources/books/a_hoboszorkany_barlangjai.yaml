            Éppen befejezed a rámolást, amikor lépéseket hallasz; valaki futva közeledik a csarnok felé. Felállsz, kihúzod a kardodat, és nem vagy benne biztos, Vajon túlélsz-e egy újabb kemény harcot. Két alak jelenik meg az ajtóban: egy Törpe és egy Elf, de nem úgy néznek ki, mint akik meg akarnának támadni. Mindkettőjüknek széles vigyor ül az arcán, és mindketten egyszerre kezdenek el beszélni hozzád. Végül is az Elf lecsöndesíti a társát, és így szól: - Elpusztítottad! Szabadok vagyunk! Végre levehetjük az engedelmesség nyakláncát! Szeretnénk viszonozni valamivel jótettedet, ezért segítünk neked kijutni innen. Arra ugyanis, amerről jöttél, nem mehetsz ki, mert a Hóboszorkány hű csatlósai lesben állnak, hogy kifelé menet megöljenek. Különben is az alagutak csak úgy hemzsegnek a Goblinoktól. Elf és Törpe barátaink éppen velük csatáznak, hogy legyen időd a menekülésre - siess hát! - Legnagyobb meglepetésedre az Elf elindul az ajtóval szemközti fal felé, és átsétál rajta. - Ez is a Hóboszorkány egyik varázslata - jegyzi meg a Törpe. - Egy menekülési lehetőség, amit ő már sohasem fog használni. A baj csak az, hogy még mi sem jártunk erre. - A Törpe jót nevet magában, és elindul a fal felé, te pedig a nyomában. Keresztüllépsz a varázskijáraton, és egy fáklyával megvilágított szűk alagútban találod magad, melyen libasorban mentek végig. Hamarosan egy elágazáshoz értek és megálltok, hogy eldöntsétek, merre is menjetek tovább.
