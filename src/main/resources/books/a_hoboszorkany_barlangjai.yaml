    - index: 9
      actions:
        - display: |
            A nyílvessző a csónak oldalába fúródik. Amilyen gyorsan csak tudtok, a túlsó part felé eveztek, de még mindig a Sötét Elf nyilának lőtávolságán belül vagytok. Látod, hogy ismét megfeszíti az íját, és lő. Tedd próbára SZERENCSÉD!
        - luck:
            lucky: 32
            unlucky: 239
    - index: 10
      actions:
        - death: |
            Pánikba esel, amikor rádöbbensz, hogy nincs olyan fegyvered, amivel elpusztíthatnál egy Vámpírt. A Hóboszorkány lassan legyőzi a fokhagymától való félelmét, és fokozatosan hatalmába keríti az akaratodat. Arra kényszerít, hogy tedd szabaddá a nyakadat, hogy a véredet szívhassa. A szolgája leszel örök időkre az élőholtak világában.
    - index: 11
      actions:
        - display: |
            Abban a pillanatban, hogy a fehér lábnyomokra lépsz, diónyi nagyságú jégdarabok kezdenek záporozni rád. Lehetetlen kitérni előlük. Vesztesz 2 ÉLETERŐ pontot. A kellemetlen zuhany amilyen hirtelen jött, olyan hirtelen el is áll, mire mindnyájan átjuttok a lábnyomokon. Az elvarázsolt barlangokat átkozva folytatjátok az utatokat.
        - modify:
            values:
                - field: STAMINA
                  value: -2
        - goto:
