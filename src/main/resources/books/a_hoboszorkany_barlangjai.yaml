    - index: 15
      actions:
        - display: |
            A Hóboszorkány sokáig méricskél, majd kimondja a szót: „Kör.” Mosolyogva kinyitod az öklödet, és felmutatod a négyzet alakú fémlapocskát. Túljártál az eszén, és ő vállalja a következményeket. A gömb fehér füsttel kezd megtelni, majd darabokra törik, és a Hóboszorkány képe is eltűnik. Sikolya betölti a barlangot, de legyőzted. Ujjongva csapjátok össze a kezeteket, de örömötök rövid életű, mert valami baljóslatú moraj üti meg a fületeket. A föld megremeg a lábatok alatt, és óriási repedések keletkeznek a jégfalban. A mennyezet kezd beomlani. Vajon ez lenne menekülési lehetőségetek, amit a Hóboszorkány ígért? Tedd próbára SZERENCSÉD!
        - luck:
            lucky: 3
            unlucky: 358
