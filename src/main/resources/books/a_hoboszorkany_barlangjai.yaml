            A többi Madárember, aki eddig fölöttetek körözött, látva társa halálát, elszáll kelet felé. Attól tartasz, hogy egy nagyobb csapattal térnek vissza, és úgy határoztok, hogy futva indultok tovább. A nap magasan fenn jár az égen, így aztán patakokban csorog rólatok a veríték. Kibírhatatlan szomjúság gyötör, és átkozódsz, amiért nincs nálad egy vízzel teli kulacs. Végül elértek egy nagyobb gödörhöz, melyben víz csillog. Úgy érzed, mindjárt felordítasz, amikor meglátod, hogy egy halott Ogre teteme hason fekve lebeg a felszínén.
