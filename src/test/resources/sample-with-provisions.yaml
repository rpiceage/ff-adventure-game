title: Provisions Test
init:
  provisions: 3
chapters:
  - index: 0
    actions:
      - display: |
          You start your adventure with 3 provisions.
      - goto:
          - chapter: 1
            text: Continue
  - index: 1
    actions:
      - display: |
          You encounter a monster and lose stamina.
      - modify:
          values:
            - field: STAMINA
              value: -5
      - goto:
          - chapter: 2
            text: Continue
  - index: 2
    actions:
      - display: |
          You can consume provisions to restore stamina.
      - goto:
          - chapter: 3
            text: Continue
  - index: 3
    actions:
      - display: |
          Your journey continues. Victory!
